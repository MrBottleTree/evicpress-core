[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evicpress-core"
version = "0.1.0"
description = "EvicPress RAM/disk KV cache manager and direct-local client"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.7", "PyYAML>=6.0.1"]

[project.optional-dependencies]
service = ["grpcio>=1.78", "protobuf>=6.31.1", "fastapi>=0.109", "uvicorn>=0.25"]

[tool.setuptools]
package-dir = {"" = "machine_b"}
packages = ["evicpress"]
